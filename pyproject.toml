[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-jewelry-automation"
version = "0.1.0"
description = "Local-only Etsy jewelry store automation system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",

    # Logging
    "structlog>=24.4.0",

    # AI providers
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    "openai>=1.52.0",
    "fal-client>=0.5.0",

    # Embeddings
    "sentence-transformers>=3.1.0",

    # HTTP
    "httpx>=0.27.2",

    # Encryption (Etsy token storage)
    "cryptography>=42.0.0",

    # Data processing
    "pandas>=2.2.0",

    # Image processing (Phase 5)
    "Pillow>=10.4.0",
    "rembg>=2.0.57",

    # Scheduling (Phase 9)
    "apscheduler>=3.10.4",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
