{% set pers_list = tabs.personalization_library %}
<div class="accordion" id="personalizationAccordion">
  {% for p in pers_list %}
  {% set slug = p.name | replace(' ', '-') | replace('.', '-') %}
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button {% if not loop.first %}collapsed{% endif %}" type="button"
              data-bs-toggle="collapse" data-bs-target="#pl-{{ slug }}">
        {{ p.name }} <span class="text-muted small ms-2">{{ p.type_signature or '' }}</span>
      </button>
    </h2>
    <div id="pl-{{ slug }}" class="accordion-collapse collapse {% if loop.first %}show{% endif %}"
         data-bs-parent="#personalizationAccordion">
      <div class="accordion-body">
        <form class="settings-form row g-3" data-settings-endpoint="/settings/personalization-library/{{ p.name }}">
          <div class="col-md-12">
            <label class="form-label small text-muted">Instruction text</label>
            <textarea name="instruction_text" class="form-control" rows="3">{{ p.instruction_text or '' }}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted">Example text</label>
            <textarea name="example_text" class="form-control" rows="2">{{ p.example_text or '' }}</textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted">Reference note</label>
            <textarea name="reference_note" class="form-control" rows="2">{{ p.reference_note or '' }}</textarea>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Max characters</label>
            <input type="number" name="max_characters" class="form-control form-control-sm" value="{{ p.max_characters if p.max_characters is not none else 0 }}">
          </div>
          <div class="col-md-3">
            <div class="form-check mt-4">
              <input type="checkbox" name="is_optional" class="form-check-input" id="pl-opt-{{ slug }}" {% if p.is_optional %}checked{% endif %}>
              <label class="form-check-label" for="pl-opt-{{ slug }}">Optional</label>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Type signature</label>
            <input type="text" name="type_signature" class="form-control form-control-sm" value="{{ p.type_signature or '' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Applicable categories (csv)</label>
            <input type="text" name="applicable_categories" class="form-control form-control-sm" data-array="csv"
                   value="{{ (p.applicable_categories or []) | join(', ') }}">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-sm">Save {{ p.name }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  {% else %}
  <div class="text-muted small p-3">No personalization templates yet.</div>
  {% endfor %}
</div>

<details class="mt-3">
  <summary class="fw-semibold small text-muted mb-2" style="cursor:pointer;">+ Add personalization</summary>
  <form class="settings-form row g-2 mt-2" data-settings-endpoint-template="/settings/personalization-library/{name}" data-settings-name-field="name">
    <div class="col-md-3">
      <input type="text" name="name" class="form-control form-control-sm" placeholder="Template name" required>
    </div>
    <div class="col-md-3">
      <input type="text" name="type_signature" class="form-control form-control-sm" placeholder="Type signature">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-sm btn-success">Add</button>
    </div>
  </form>
</details>
