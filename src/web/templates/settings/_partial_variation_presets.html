{% set presets = tabs.variation_presets %}
<div class="accordion" id="variationPresetsAccordion">
  {% for p in presets %}
  {% set slug = p.name | replace(' ', '-') | replace('.', '-') %}
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button {% if not loop.first %}collapsed{% endif %}" type="button"
              data-bs-toggle="collapse" data-bs-target="#vp-{{ slug }}">
        {{ p.name }} <span class="text-muted small ms-2">{{ p.category }} · {{ p.material_type }}</span>
      </button>
    </h2>
    <div id="vp-{{ slug }}" class="accordion-collapse collapse {% if loop.first %}show{% endif %}"
         data-bs-parent="#variationPresetsAccordion">
      <div class="accordion-body">
        <form class="settings-form row g-3" data-settings-endpoint="/settings/variation-presets/{{ p.name }}">
          <div class="col-md-4">
            <label class="form-label small text-muted">Category</label>
            <input type="text" name="category" class="form-control form-control-sm" value="{{ p.category or '' }}">
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted">Material type</label>
            <select name="material_type" class="form-select form-select-sm">
              {% for mt in material_types %}
              <option value="{{ mt }}" {% if p.material_type == mt %}selected{% endif %}>{{ mt }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <div class="form-check mt-4">
              <input type="checkbox" name="has_length_variation" class="form-check-input" id="vp-hlv-{{ slug }}"
                     {% if p.has_length_variation %}checked{% endif %}>
              <label class="form-check-label" for="vp-hlv-{{ slug }}">Has length variation</label>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted">Finishes (comma-separated)</label>
            <input type="text" name="finishes" class="form-control form-control-sm" data-array="csv"
                   value="{{ (p.finishes or []) | join(', ') }}">
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted">Lengths in inches (comma-separated)</label>
            <input type="text" name="lengths_inches" class="form-control form-control-sm" data-array="csv-num"
                   value="{{ (p.lengths_inches or []) | join(', ') }}">
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted">Multi-count label</label>
            <input type="text" name="multi_count_label" class="form-control form-control-sm" value="{{ p.multi_count_label or '' }}">
          </div>
          <div class="col-md-8">
            <label class="form-label small text-muted">Multi-count range (comma-separated)</label>
            <input type="text" name="multi_count_range" class="form-control form-control-sm" data-array="csv-num"
                   value="{{ (p.multi_count_range or []) | join(', ') }}">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-sm">Save {{ p.name }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  {% else %}
  <div class="text-muted small p-3">No variation presets yet.</div>
  {% endfor %}
</div>

<details class="mt-3">
  <summary class="fw-semibold small text-muted mb-2" style="cursor:pointer;">+ Add preset</summary>
  <form class="settings-form row g-2 mt-2" data-settings-endpoint-template="/settings/variation-presets/{name}" data-settings-name-field="name">
    <div class="col-md-3">
      <input type="text" name="name" class="form-control form-control-sm" placeholder="Preset name" required>
    </div>
    <div class="col-md-2">
      <input type="text" name="category" class="form-control form-control-sm" placeholder="necklace" required>
    </div>
    <div class="col-md-2">
      <select name="material_type" class="form-select form-select-sm">
        {% for mt in material_types %}
        <option value="{{ mt }}">{{ mt }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <input type="text" name="finishes" class="form-control form-control-sm" placeholder="Gold, Silver, Rose"
             data-array="csv" required>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-sm btn-success">Add</button>
    </div>
  </form>
</details>
