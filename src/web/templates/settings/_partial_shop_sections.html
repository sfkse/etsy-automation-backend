{% set sections = tabs.shop_sections %}
<div class="table-responsive mb-3">
  <table class="table table-sm align-middle">
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Carrier pillar</th>
        <th>Display order</th>
        <th>Etsy section ID</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="shop-sections-tbody">
      {% for s in sections %}
      <tr data-section-name="{{ s.name }}">
        <form class="settings-form contents" data-settings-endpoint="/settings/shop-sections/{{ s.name }}">
          <td><input type="text" name="name" class="form-control form-control-sm" value="{{ s.name }}" readonly></td>
          <td>
            <select name="carrier_pillar" class="form-select form-select-sm">
              <option value="">—</option>
              {% for pillar in carrier_pillars %}
              <option value="{{ pillar }}" {% if s.carrier_pillar == pillar %}selected{% endif %}>{{ pillar }}</option>
              {% endfor %}
            </select>
          </td>
          <td><input type="number" name="display_order" class="form-control form-control-sm" value="{{ s.display_order if s.display_order is not none else 0 }}"></td>
          <td><input type="text" class="form-control form-control-sm" value="{{ s.etsy_section_id or '' }}" readonly></td>
          <td class="text-nowrap">
            <button type="submit" class="btn btn-sm btn-primary">Save</button>
            <button type="button" class="btn btn-sm btn-outline-danger delete-section-btn" data-section-name="{{ s.name }}">Delete</button>
          </td>
        </form>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-muted small text-center py-3">No shop sections yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<details>
  <summary class="fw-semibold small text-muted mb-2" style="cursor:pointer;">+ Add new section</summary>
  <form class="settings-form row g-2 mt-2" data-settings-endpoint-template="/settings/shop-sections/{name}" data-settings-name-field="name">
    <div class="col-md-3">
      <input type="text" name="name" class="form-control form-control-sm" placeholder="Section name" required>
    </div>
    <div class="col-md-3">
      <select name="carrier_pillar" class="form-select form-select-sm">
        <option value="">—</option>
        {% for pillar in carrier_pillars %}
        <option value="{{ pillar }}">{{ pillar }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <input type="number" name="display_order" class="form-control form-control-sm" value="0">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-sm btn-success">Add</button>
    </div>
  </form>
</details>
