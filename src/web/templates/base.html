<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Etsy Jewelry Automation{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; color: #e05c2a !important; }
    .badge-rising      { background: #198754; }
    .badge-active      { background: #0d6efd; }
    .badge-legacy      { background: #6c757d; }
    .badge-unknown     { background: #adb5bd; }
    .score-high   { color: #198754; font-weight: 600; }
    .score-medium { color: #fd7e14; font-weight: 600; }
    .score-low    { color: #6c757d; }
    .thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .thumbnail-card { border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .thumbnail-card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .thumbnail-card .info { padding: 6px 8px; font-size: .78rem; }
    .tag-chip { display: inline-block; background: #e9ecef; border-radius: 20px; padding: 2px 10px; margin: 2px; font-size: .8rem; }
    .cliche-item { background: #fff3cd; border-left: 3px solid #ffc107; padding: 4px 10px; margin-bottom: 4px; border-radius: 0 4px 4px 0; font-size: .85rem; }
    .underused-item { background: #d1e7dd; border-left: 3px solid #198754; padding: 4px 10px; margin-bottom: 4px; border-radius: 0 4px 4px 0; font-size: .85rem; }
    .pattern-card { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-family: monospace; font-size: .85rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Etsy Automation</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/products/new">+ New Product</a></li>
        <li class="nav-item"><a class="nav-link" href="/research">Research</a></li>
        <li class="nav-item"><a class="nav-link" href="/research/shops">Shops</a></li>
        <li class="nav-item"><a class="nav-link" href="/research/import">Import CSV</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/keywords">Keywords</a></li>
        <li class="nav-item"><a class="nav-link" href="/approval">Approval</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/etsy">Publish</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
